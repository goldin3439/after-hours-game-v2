```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Understanding ❤️</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #482044, #100d1c 65%);
    }

    .card {
      width: 100%;
      max-width: 410px;
      padding: 28px 22px;
      border: 1px solid #74446e;
      border-radius: 22px;
      background: rgba(25, 19, 38, 0.96);
      box-shadow: 0 15px 45px #0008;
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      color: #ffb4d8;
    }

    .subtitle {
      text-align: center;
      color: #c7b7cc;
      font-size: 14px;
      line-height: 1.5;
      margin: 10px 0 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 13px;
      color: #f4d9ed;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #59405f;
      border-radius: 10px;
      background: #211a2d;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff80bd;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(90deg, #ff6eaa, #bd70ff);
      color: #211027;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 18px;
      color: #bbaac2;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    #message {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #ffb4d8;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎮❤️</div>
    <h1>Game of Understanding</h1>
    <p class="subtitle">
      Create your player identity and enter your gaming world.
    </p>

    <form id="registerForm">
      <label for="playerName">Player name</label>
      <input id="playerName" type="text"
        placeholder="Enter your player name"
        maxlength="24" required>

      <label for="gameId">Choose your Game ID</label>
      <input id="gameId" type="text"
        placeholder="Example: Goldin7"
        maxlength="8" minlength="3"
        pattern="(?=.*[A-Z])[A-Za-z0-9]{3,8}"
        title="Use 3–8 letters or numbers and at least one uppercase letter."
        required>

      <label for="password">Create password</label>
      <input id="password" type="password"
        placeholder="At least 8 characters"
        minlength="8" required>

      <label for="avatar">Choose your avatar</label>
      <select id="avatar" required>
        <option value="🎮">🎮 Gamer</option>
        <option value="🦊">🦊 Fox</option>
        <option value="🐼">🐼 Panda</option>
        <option value="🐯">🐯 Tiger</option>
        <option value="🐸">🐸 Frog</option>
        <option value="🐱">🐱 Cat</option>
        <option value="🐺">🐺 Wolf</option>
        <option value="🐻">🐻 Bear</option>
      </select>

      <button type="submit">Create Player Account →</button>
      <div id="message" role="status"></div>
    </form>

    <p class="note">
      Your Game ID must be 3–8 characters and contain at least
      one uppercase letter. Accounts will be connected to secure
      Firebase authentication in the next implementation step.
    </p>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "Registration screen ready! Account creation is not connected yet.";
    });
  </script>
</body>
</html>
